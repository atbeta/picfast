name: OpenAPI Lint

on:
  pull_request:
    paths:
      - "api/openapi.yaml"
      - "internal/router/**"
      - ".github/workflows/openapi-lint.yml"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - "api/openapi.yaml"
      - "internal/router/**"
      - ".github/workflows/openapi-lint.yml"
      - "Makefile"

jobs:
  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Lint OpenAPI spec
        run: make openapi-lint
