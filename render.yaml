# Render Blueprint —— 支撑 README 里「Deploy to Render」一键部署按钮（Free 档、不需要绑卡）。
#
# 会创建的只有一个资源：运行预构建 slim 镜像的 Free 档 Web 服务
# （不重新构建、不需要镜像仓库）。刻意不创建 cron 服务与 Render Postgres：
# Render 的 cron 没有免费档，免费 Postgres 也会在 30 天后过期，因此
# 数据库请用外部免费托管 PG（推荐 Neon：永久免费、不需要绑卡）。
#
# Free 档的实际取舍（详见 docs/serverless.md）：
#   0.1 CPU / 512 MB 内存；15 分钟无入站流量后休眠，再访问约 1 分钟启动；
#   每月 750 实例小时；休眠时会丢本地文件系统上的改动。
#   内置后台任务每 5 秒轮询一次数据库，会让 Neon 无法缩容到零而吃掉免费计算额度，
#   若实例长期在线，可设 PICFAST_JOBS_EMBEDDED=false 并改用外部定时触发。
#
# ============================ 存储策略怎么配 ============================
# 平台磁盘是临时的，serverless 场景下**只有 S3 兼容存储才有意义**。两种做法：
#
# A) 在创建页直接填（下面那三个环境变量）：
#    PICFAST_STORAGE_DEFAULT_TYPE   = s3
#    PICFAST_STORAGE_DEFAULT_CONFIG = 一行 JSON（见 S3_STORAGE_HINT 里的示例）
#    → 首次启动就会直接创建 S3 策略。**留空则自动使用本地存储并打印 WARN**
#      （不推荐：实例休眠/重建就丢图）；JSON 写错才会拒绝启动（fail-fast）。
#    ⚠️ 只在**数据库里还没有任何存储策略**时生效：全新库 / 清库重来可以，
#       已经跑过的库请走 B 方案。
#
# B) 先部署起来，再登录后台「存储策略」→ 新建 S3 策略 → 填 endpoint / bucket /
#    access key / secret，路径风格选 path-style（Neon Object Storage、MinIO、R2 都要），
#    链接模式选 proxy（私有桶不必公开），保存后设为分组默认即可，**无需重新部署**。
#
# 免卡的免费额度可选：Backblaze B2（10 GB 永久免费）、Neon Object Storage（5 GB）。
#
# 参考配置（Neon Object Storage，仅支持 path-style）：
#   {"endpoint":"https://<project>.storage.<region>.aws.neon.tech","region":"<region>",
#    "bucket":"picfast","access_key":"...","secret_key":"...",
#    "use_path_style":true,"link_mode":"proxy"}
# Cloudflare R2 形如：
#   {"endpoint":"https://<account>.r2.cloudflarestorage.com","region":"auto",
#    "bucket":"pics","access_key":"...","secret_key":"...","use_path_style":true,"link_mode":"proxy"}
# ======================================================================

services:
  - type: web
    name: picfast
    runtime: image
    image:
      url: docker.io/xbeta/picfast:slim
    region: singapore
    plan: free
    healthCheckPath: /readyz
    # 注意：Free 档不支持 maxShutdownDelaySeconds / scaling / disk / one-off jobs，
    # 所以这里不设——设了 Blueprint 校验会直接报
    # "max shutdown delay is not supported for free tier services"。
    envVars:
      - key: PICFAST_DATABASE_URL
        sync: false            # 创建时粘贴托管 PG 连接串；池化串请追加 default_query_exec_mode=exec
      - key: PICFAST_JWT_SECRET
        generateValue: true
      - key: PICFAST_SERVER_METRICS_ENABLED
        value: "false"
      - key: PICFAST_APP_MAX_UPLOAD_BYTES
        value: "10485760"      # 10 MiB：Free 档 512 MB 内存下先留足解码余量
      # —— 存储（可留空）：填了就是"首启即 S3"，留空则用本地存储（临时磁盘，不推荐）。
      #    Render 的创建页只显示 Key/Value、不显示注释，所以类型与配置都做成可填项，
      #    下面那行 S3_STORAGE_HINT 会把该填什么直接摆在页面上。
      - key: PICFAST_STORAGE_DEFAULT_TYPE
        sync: false            # 填 s3（留空 = 本地存储）
      - key: PICFAST_STORAGE_DEFAULT_CONFIG
        sync: false            # 填一行 JSON（留空 = 本地存储；JSON 非法会拒绝启动）
      - key: S3_STORAGE_HINT
        value: 'S3 配置示例（DEFAULT_TYPE 填 s3，DEFAULT_CONFIG 填下面这行）：{"endpoint":"https://<account>.r2.cloudflarestorage.com","region":"auto","bucket":"picfast","access_key":"AK","secret_key":"SK","use_path_style":true,"link_mode":"proxy"}'
