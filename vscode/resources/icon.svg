<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <!-- Premium Apple-like Blue Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28C2FF"/>
      <stop offset="100%" stop-color="#0062FF"/>
    </linearGradient>

    <!-- Inner Border for 3D glass edge -->
    <linearGradient id="innerBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Rich Blue Drop Shadow to make the white graphic pop smoothly -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#002277" flood-opacity="0.5"/>
    </filter>

    <!-- Subtle Upload Arrow Cutout Mask (Smaller, fatter, semi-transparent) -->
    <mask id="sunMask">
      <rect width="512" height="512" fill="white"/>
      <path d="M 136 202 L 136 190 M 130 196 L 136 190 L 142 196" fill="none" stroke="#777777" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- Glass inner edge -->
  <rect x="1" y="1" width="510" height="510" rx="114" fill="none" stroke="url(#innerBorder)" stroke-width="2"/>

  <!-- Center Graphic -->
  <g filter="url(#shadow)">
    <!-- The abstract mountains line -->
    <path d="M 120 260 L 192 332 L 280 196 L 344 292 L 392 244" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- The sun (dot) with the softer easter egg arrow -->
    <circle cx="136" cy="196" r="27" fill="#FFFFFF" mask="url(#sunMask)"/>
  </g>
</svg>
