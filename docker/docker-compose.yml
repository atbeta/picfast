services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: picfast
      POSTGRES_PASSWORD: picfast
      POSTGRES_DB: picfast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picfast"]
      interval: 2s
      timeout: 2s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PICFAST_DATABASE_URL: "postgres://picfast:picfast@db:5432/picfast?sslmode=disable"
      PICFAST_JWT_SECRET: "change-me-in-production"
      PICFAST_SERVER_BASE_URL: "http://localhost:8080"
      PICFAST_APP_ADMIN_EMAIL: "admin@example.com"
      PICFAST_APP_ADMIN_PASSWORD: "changeme123"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/data/uploads
      - thumbnails:/app/data/thumbnails

volumes:
  pgdata:
  uploads:
  thumbnails:
