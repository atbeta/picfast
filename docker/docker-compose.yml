services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - picfast

  init-permissions:
    image: busybox:latest
    restart: "no"
    user: "0:0"
    command: sh -c "mkdir -p /data/uploads /data/thumbnails /data/backups && chown -R 10001:10001 /data/uploads /data/thumbnails /data/backups"
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/thumbnails:/data/thumbnails
      - ./data/backups:/data/backups

  app:
    image: ${PICFAST_IMAGE:-xbeta/picfast:latest}
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "${PICFAST_HTTP_BIND:-127.0.0.1}:${PICFAST_HTTP_PORT:-18080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PICFAST_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PICFAST_SERVER_BASE_URL: ${PICFAST_SERVER_BASE_URL}
      PICFAST_SERVER_METRICS_ADDR: ${PICFAST_SERVER_METRICS_ADDR:-:9190}
      PICFAST_JWT_SECRET: ${PICFAST_JWT_SECRET}
      PICFAST_APP_NAME: ${PICFAST_APP_NAME:-PicFast}
      PICFAST_APP_SITE_DESCRIPTION: ${PICFAST_APP_SITE_DESCRIPTION:-}
      PICFAST_APP_ADMIN_EMAIL: ${PICFAST_APP_ADMIN_EMAIL:-}
      PICFAST_APP_ADMIN_PASSWORD: ${PICFAST_APP_ADMIN_PASSWORD:-}
      PICFAST_APP_ALLOW_GUEST_UPLOAD: ${PICFAST_APP_ALLOW_GUEST_UPLOAD:-false}
      PICFAST_APP_ALLOW_REGISTRATION: ${PICFAST_APP_ALLOW_REGISTRATION:-false}
      PICFAST_APP_REQUIRE_EMAIL_VERIFICATION: ${PICFAST_APP_REQUIRE_EMAIL_VERIFICATION:-true}
      PICFAST_APP_MODERATION_MODE: ${PICFAST_APP_MODERATION_MODE:-disabled}
      PICFAST_APP_USER_INITIAL_CAPACITY: ${PICFAST_APP_USER_INITIAL_CAPACITY:-524288000}
      PICFAST_APP_DEFAULT_IMAGE_TTL: ${PICFAST_APP_DEFAULT_IMAGE_TTL:-0}
      PICFAST_APP_GUEST_IMAGE_TTL: ${PICFAST_APP_GUEST_IMAGE_TTL:-0}
      PICFAST_APP_FOOTER_TEXT_1: ${PICFAST_APP_FOOTER_TEXT_1:-}
      PICFAST_APP_FOOTER_LINK_1: ${PICFAST_APP_FOOTER_LINK_1:-}
      PICFAST_APP_FOOTER_TEXT_2: ${PICFAST_APP_FOOTER_TEXT_2:-}
      PICFAST_APP_FOOTER_LINK_2: ${PICFAST_APP_FOOTER_LINK_2:-}
      PICFAST_APP_ANALYTICS_PROVIDER: ${PICFAST_APP_ANALYTICS_PROVIDER:-}
      PICFAST_APP_ANALYTICS_CONFIG: ${PICFAST_APP_ANALYTICS_CONFIG:-}
      PICFAST_STORAGE_LOCAL_ROOT: /app/data/uploads
      PICFAST_STORAGE_THUMBNAIL_DIR: /app/data/thumbnails
      PICFAST_MAIL_HOST: ${PICFAST_MAIL_HOST:-}
      PICFAST_MAIL_PORT: ${PICFAST_MAIL_PORT:-587}
      PICFAST_MAIL_USERNAME: ${PICFAST_MAIL_USERNAME:-}
      PICFAST_MAIL_PASSWORD: ${PICFAST_MAIL_PASSWORD:-}
      PICFAST_MAIL_FROM_EMAIL: ${PICFAST_MAIL_FROM_EMAIL:-}
      PICFAST_MAIL_FROM_NAME: ${PICFAST_MAIL_FROM_NAME:-PicFast}
      PICFAST_MAIL_ENCRYPTION: ${PICFAST_MAIL_ENCRYPTION:-starttls}
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/thumbnails:/app/data/thumbnails
      - ./data/backups:/app/data/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - picfast

networks:
  picfast:
    driver: bridge
