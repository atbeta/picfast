server:
  port: 8080
  base_url: "http://localhost:8080"

database:
  url: "postgres://picfast:picfast@localhost:5432/picfast?sslmode=disable"

jwt:
  secret: "change-me-in-production"
  access_ttl: 15m
  refresh_ttl: 168h

storage:
  local_root: "./data/uploads"
  thumbnail_dir: "./data/thumbnails"

mail:
  host: "127.0.0.1"
  port: 1025
  username: ""
  password: ""
  from_email: "noreply@picfast.local"
  from_name: "PicFast"
  encryption: "none"          # starttls | tls | none

app:
  name: "PicFast"
  site_description: "PicFast is a modern self-hosted image hosting service."
  favicon_url: ""              # custom site icon URL; empty uses bundled favicon
  allow_guest_upload: false
  allow_registration: true
  require_email_verification: true  # only takes effect when mail.* is configured and reachable
  user_initial_capacity: 524288000
  default_image_ttl: "0"       # 0 = no default expiration; e.g. "24h", "168h"
  guest_image_ttl: "0"        # 0 = use default_image_ttl for guests; e.g. "24h" for shorter guest retention
  admin_email: ""
  admin_password: ""
  moderation_mode: "disabled"  # disabled | manual | auto (future)
  footer_text_1: ""             # footer item 1 text; hidden if empty
  footer_link_1: ""             # footer item 1 link; if set, text becomes a hyperlink
  footer_text_2: ""             # footer item 2 text; hidden if empty
  footer_link_2: ""             # footer item 2 link; if set, text becomes a hyperlink
  analytics_provider: ""       # plausible | umami | ga4 | baidu | custom
  analytics_config: "{}"       # provider-specific JSON; configurable in admin console
