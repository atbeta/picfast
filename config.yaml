server:
  port: 8080
  base_url: "http://localhost:8080"

database:
  url: "postgres://picfast:picfast@localhost:5432/picfast?sslmode=disable"

jwt:
  secret: "change-me-in-production"
  access_ttl: 15m
  refresh_ttl: 168h

storage:
  local_root: "./data/uploads"
  thumbnail_dir: "./data/thumbnails"

mail:
  host: ""
  port: 587
  username: ""
  password: ""
  from_email: ""
  from_name: "PicFast"
  encryption: "starttls"      # starttls | tls | none

app:
  name: "PicFast"
  allow_guest_upload: false
  allow_registration: false
  require_email_verification: false # reserved for future email verification flow; keep false until mail delivery is configured
  user_initial_capacity: 524288000
  default_image_ttl: "0"       # 0 = no default expiration; e.g. "24h", "7d"
  admin_email: ""
  admin_password: ""
  moderation_mode: ""  # disabled | manual | auto (future)
